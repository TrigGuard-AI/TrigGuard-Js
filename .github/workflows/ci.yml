name: CI

# CircleCI job sdk_checks owns this check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Build (import smoke)
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
